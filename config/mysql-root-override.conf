# Force the database server to run as root (intentional misconfig that makes the
# file-based UDF exploit (EDB-1518) yield a root shell).
#
# MySQL:   /etc/systemd/system/mysql.service.d/override.conf
# MariaDB: /etc/systemd/system/mariadb.service.d/override.conf
#
# After copying:  systemctl daemon-reload && systemctl restart mysql|mariadb
[Service]
User=root
Group=root
ExecStart=
ExecStart=/usr/sbin/mariadbd --user=root
# NOTE: for MariaDB the binary is /usr/sbin/mariadbd, so use:
#   ExecStart=/usr/sbin/mariadbd --user=root
