<VirtualHost *:80>
    ServerName maintenance_v001noreleased-debug-mode.vendor.fenrir
    ServerAlias *.vendor.fenrir
    DocumentRoot /var/www/maintenance_v001noreleased-debug-mode

    <Directory /var/www/maintenance_v001noreleased-debug-mode>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
        CGIPassAuth On
    </Directory>

    # Artifacts must only be served through download.php (technician JWT).
    <Directory /var/www/maintenance_v001noreleased-debug-mode/files>
        Require all denied
    </Directory>

    ErrorLog  ${APACHE_LOG_DIR}/maintenance_error.log
    CustomLog ${APACHE_LOG_DIR}/maintenance_access.log combined
</VirtualHost>
