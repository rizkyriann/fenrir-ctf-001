# VendorLedger Apache vhost
# Copy to: /etc/apache2/sites-available/vendorledger.conf
# Enable:  a2ensite vendorledger && a2dissite 000-default && systemctl reload apache2
#
# PHP is handled by libapache2-mod-php (a2enmod php8.1; stock handler matches
# .ph(ar|p|tml)).
<VirtualHost *:80>
    ServerName vendor.fenrir
    ServerAlias vendorledger.local
    DocumentRoot /var/www/vendorledger

    # Reveal the vhost name to scanners (nmap -sV/-sC: http-title, http-headers)
    Header always set X-Vendor-Host "vendor.fenrir"

    <Directory /var/www/vendorledger>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>


    ErrorLog  ${APACHE_LOG_DIR}/vendorledger_error.log
    CustomLog ${APACHE_LOG_DIR}/vendorledger_access.log combined
</VirtualHost>
